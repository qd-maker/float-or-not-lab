services:
  api:
    build:
      context: ./backend
    container_name: float-or-not-lab-api
    ports:
      - "8000:8000"
    environment:
      CORS_ORIGINS: "http://localhost:5173,http://127.0.0.1:5173"

  web:
    build:
      context: ./frontend
    container_name: float-or-not-lab-web
    ports:
      - "5173:5173"
    environment:
      VITE_API_BASE_URL: "http://localhost:8000"
    depends_on:
      - api
